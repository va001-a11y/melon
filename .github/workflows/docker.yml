name: Container image

# Two jobs, answering two different questions.
#
# `verify` proves the Dockerfile still builds AND still runs, on every push and
# pull request. Melon is developed on a machine with no Docker on it, so CI is
# the only thing that ever compiles this image — without this job a broken
# Dockerfile would be discovered by whoever first tried to install Melon,
# which is the worst possible moment to find out.
#
# `publish` runs only on a version tag and pushes the image to GitHub's own
# container registry, so people can run Melon without cloning the repo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    # A tag goes straight to publish, which builds the same image anyway.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # This runner's architecture only. It is a correctness check, and
      # emulated arm64 would multiply the time for no additional signal —
      # publish covers the other architecture.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: melon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building only proves it compiles. This proves it runs: a broken
      # entrypoint, a file missed by the runtime stage, or a server that binds
      # the wrong address would all still build perfectly green.
      # Melon's reason to exist in a container is talking to a local model,
      # and that is the one thing the image cannot prove on its own: the
      # request has to cross back out of the container to the host. So the
      # runner becomes the host. It installs Ollama exactly as a user would,
      # and the container reaches it exactly as it would on a real machine --
      # same host-gateway mapping, same OLLAMA_HOST. Neither of the author's
      # machines can run Docker, so without this nobody ever tests this path.
      - name: Install Ollama on the runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer registers a systemd service and starts it, so an
          # Ollama already holds port 11434 bound to 127.0.0.1 -- which
          # REFUSES connections arriving from a container through the host
          # gateway, since those do not come from loopback. A second
          # `ollama serve` cannot fix that: it dies on the taken port while a
          # curl to 127.0.0.1 still succeeds against the first one, so the
          # bind looks corrected and is not. That mistake cost a CI run.
          #
          # What follows is verbatim the Linux procedure the README gives
          # users, so the documented fix is what gets tested.
          CONF=/etc/systemd/system/ollama.service.d
          sudo mkdir -p $CONF
          echo '[Service]' | sudo tee $CONF/override.conf
          echo 'Environment="OLLAMA_HOST=0.0.0.0:11434"' | sudo tee -a $CONF/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          # Assert the bind instead of assuming it. A listener on 127.0.0.1
          # answers the curl above perfectly while staying invisible to a
          # container, which is the entire failure being guarded against.
          ss -ltn | grep 11434
          ss -ltn | grep -qF -e '0.0.0.0:11434' -e '*:11434'
          echo "Ollama is listening on all interfaces"

      # Small enough to pull in seconds. What is under test is the network
      # path and Melon's parsing of the model list, not the model.
      - name: Pull a tiny model
        run: ollama pull qwen2.5:0.5b

      - name: Run it and check it answers
        run: |
          docker run -d --name melon-ci -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e OLLAMA_HOST=http://host.docker.internal:11434 \
            melon:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 1
          done
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:8080/api/health
          # The interface has to be served too. Express coming up without the
          # built client beside it would pass every check above.
          echo "--- / ---"
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Melon" && echo "UI served"
          # An unknown API path must 404 rather than being swallowed by the
          # single-page fallback, or a typo would answer with HTML.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = "404" \
            && echo "API 404 intact"

      # The payoff: Melon's own probe, running inside the container, finding
      # a real Ollama out on the host and reading its model list back.
      - name: Check the container can see Ollama on the host
        run: |
          # Separate the network from the app: if this line fails it is
          # Docker or the bind, and nothing to do with Melon's own probing.
          docker exec melon-ci node -e "fetch('http://host.docker.internal:11434/api/tags').then(r => r.text()).then(t => console.log('reached Ollama from inside the container:', t.slice(0, 120)))"
          curl -fsS http://127.0.0.1:8080/api/detect-local > /tmp/detect.json
          cat /tmp/detect.json
          echo
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/detect.json"))
          o = next(r for r in d["runtimes"] if r["id"] == "ollama")
          assert o["found"], "container could not reach Ollama: %s" % d.get("diagnosis")
          assert any("qwen2.5" in m for m in o["models"]), "model list empty: %s" % o
          print("Container reached Ollama at", o["baseUrl"], "and sees", o["models"])
          PY

      - name: Ollama logs
        if: always()
        run: sudo journalctl -u ollama --no-pager -n 40 || true

      - name: Container logs
        if: always()
        run: docker logs melon-ci || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to GHCR. No secret to create,
      # store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on an x86 runner, which needs QEMU registered first.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag v0.4.2 publishes :0.4.2, :0.4 and :latest, so people can pin as
      # loosely or as tightly as they want.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Raspberry Pis and Apple Silicon are both common in this audience,
          # and both are arm64. Emulation makes it slow, which is acceptable
          # on a tag but would not be on every push.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
